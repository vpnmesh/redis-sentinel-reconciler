{{- if eq .Values.workload "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rsr.fullname" . }}
  labels:
    {{- include "rsr.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rsr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rsr.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: reconciler
          image: "{{ include "rsr.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if .Values.sentinelAddr }}
            - --sentinel-addr={{ .Values.sentinelAddr }}
            {{- end }}
            {{- include "rsr.commonArgs" . | nindent 12 }}
          {{- $auth := include "rsr.authEnv" . | trim }}
          {{- if $auth }}
          env:
            {{- $auth | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
