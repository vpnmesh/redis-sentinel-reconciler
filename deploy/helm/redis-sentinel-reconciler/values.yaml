# https://hub.docker.com/r/vpnmesh/redis-sentinel-reconciler
image:
  repository: vpnmesh/redis-sentinel-reconciler
  # Empty: Chart.appVersion (stamped from the v* tag). Git tree 0.0.0 uses latest.
  tag: ""
  pullPolicy: IfNotPresent

# One reconciler pod per Sentinel. Default is StatefulSet (Bitnami
# Redis+Sentinel in-cluster, same namespace, default names redis-node-N).
# DaemonSet: Sentinel on the host (bare-metal, hostNetwork).
workload: StatefulSet
replicaCount: 3
nameOverride: ""

# Observe by default. Flip apply=true after you have watched ticks.
apply: false
localSentinel: true
interval: 30s
masterName: mymaster
# Required: every Redis/Valkey data node that can become master, port 6379.
# The whole cluster, not only this pod's host.
redisAddrs: []
# redisAddrs: ["db-n1.example.com:6379", "db-n2.example.com:6379", "db-n3.example.com:6379"]
# Required for DaemonSet: Sentinel on this host, host:26379.
# TLS: DNS name on the cert, not 127.0.0.1.
sentinelAddr: ""

# StatefulSet: this replica talks to prefix + ordinal + suffix
# (pod redis-sentinel-reconciler-0 dials redis-node-0.redis-headless:26379).
# Bitnami Redis chart default pod names, no fullnameOverride.
sentinelFromOrdinal:
  enabled: true
  prefix: redis-node-
  suffix: .redis-headless:26379

# Matches Dockerfile USER 65534 (nobody).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  capabilities:
    drop: ["ALL"]

healCooldown: 15m
healLease: true
equalEpochEscalate: true
metrics:
  enabled: true
  port: 9123

auth:
  redisUsername: ""
  sentinelUsername: ""
  redisPassword: ""
  sentinelPassword: ""
  # SENTINEL SET auth-* after MONITOR. Empty = probe redisUsername/Password.
  sentinelRedisUsername: ""
  sentinelRedisPassword: ""
  # If set, REDIS/SENTINEL passwords come from this Secret (Bitnami key redis-password).
  existingSecret: ""
  existingSecretKey: redis-password

tls:
  enabled: false
  skipVerify: false
  caFile: ""
  # SNI only when sentinelAddr / redisAddrs host is an IP. Hostname dials
  # use the name in the address. Leave empty if you dial DNS names.
  serverName: ""
  certFile: ""
  keyFile: ""

# Mount a CA / client cert, then point tls.caFile at the in-container path.
extraVolumes: []
extraVolumeMounts: []

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 200m, memory: 128Mi }
