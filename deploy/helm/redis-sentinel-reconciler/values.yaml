image:
  repository: redis-sentinel-reconciler
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Observe by default. Flip apply=true only after a soak + Owner GO.
apply: false
localSentinel: true
healLease: true
equalEpochEscalate: true
healCooldown: 15m
interval: 30s
masterName: mymaster
# Must list all Redis data-plane seeds (oracle), port 6379. Required at start.
redisAddrs: []
# redisAddrs: ["db-n1.example.com:6379", "db-n2.example.com:6379", "db-n3.example.com:6379"]
# TLS: use the DNS name on the cert. 127.0.0.1 needs tls.serverName (IP-only SNI).
sentinelAddr: "db-n1.example.com:26379"
metrics:
  enabled: true
  port: 9123

auth:
  redisUsername: ""
  sentinelUsername: ""
  redisPassword: ""
  sentinelPassword: ""

tls:
  enabled: false
  skipVerify: false
  caFile: ""
  # SNI only when sentinelAddr / redisAddrs host is an IP. Hostname dials
  # use the name in the address. Leave empty if you dial DNS names.
  serverName: ""
  certFile: ""
  keyFile: ""

# Mount a CA / client cert, then point tls.caFile at the in-container path.
extraVolumes: []
extraVolumeMounts: []

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { cpu: 200m, memory: 128Mi }
