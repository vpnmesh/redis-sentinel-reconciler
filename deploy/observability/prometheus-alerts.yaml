# Prometheus alerts — redis-sentinel-reconciler

Scrapes `redis_sentinel_reconciler_*` from `--metrics-addr` (e.g. `:9090/metrics`).
Runbooks: docs/operations.md

```yaml
groups:
 - name: redis-sentinel-reconciler
    rules:
     - alert: RedisSentinelReconcilerDiverge
        expr: increase(redis_sentinel_reconciler_diverge[10m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Sentinel ads diverge from writable Redis oracle"
          runbook: "docs/operations.md"

     - alert: RedisSentinelReconcilerDualMaster
        expr: increase(redis_sentinel_reconciler_alert_dual_master[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Dual writable Redis — reconciler will not heal"
          runbook: "docs/operations.md"

     - alert: RedisSentinelReconcilerEqualEpochTrap
        expr: increase(redis_sentinel_reconciler_alert_equal_epoch_trap[10m]) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Equal config-epoch and disagreeing master ads"
          runbook: "docs/operations.md"

     - alert: RedisSentinelReconcilerEqualEpochEscalate
        expr: increase(redis_sentinel_reconciler_alert_equal_epoch_escalate[10m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Equal-epoch trap and FAILOVER unsafe — do not MONITOR-thrash"
          runbook: "docs/operations.md"

     - alert: RedisSentinelReconcilerHealFailed
        expr: increase(redis_sentinel_reconciler_heal_fail[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "API heal failed (conf_fallback_needed may be set)"
          runbook: "docs/operations.md"

     - alert: RedisSentinelReconcilerApplyRefusedSpike
        expr: increase(redis_sentinel_reconciler_apply_refused[10m]) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Many apply_refused — check lease, cooldown, partition guards"
```
