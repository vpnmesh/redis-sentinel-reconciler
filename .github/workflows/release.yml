name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: go test ./...
      - name: Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/package-linux-amd64.sh
      - name: Tarball CLI lockstep
        run: |
          tar -tzf dist/redis-sentinel-reconciler_*_linux_amd64.tar.gz | head
          dir="$(tar -tzf dist/redis-sentinel-reconciler_*_linux_amd64.tar.gz | head -1 | cut -d/ -f1)"
          tar -xzf dist/redis-sentinel-reconciler_*_linux_amd64.tar.gz -C /tmp
          /tmp/"$dir"/reconciler -h 2>&1 | tee /tmp/rsr-rel-help.txt
          grep -E -- '-tls$' /tmp/rsr-rel-help.txt
          grep -- '-redis-username' /tmp/rsr-rel-help.txt
          grep -- '-sentinel-username' /tmp/rsr-rel-help.txt
          grep -- '-sentinel-redis-username' /tmp/rsr-rel-help.txt
      - name: Helm package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          helm lint deploy/helm/redis-sentinel-reconciler
          extra=()
          if [ "$VERSION" != "dev" ]; then
            extra=(--version "$VERSION" --app-version "$VERSION")
          fi
          helm package deploy/helm/redis-sentinel-reconciler -d dist "${extra[@]}"
          if [ "$VERSION" != "dev" ]; then
            helm show chart "dist/redis-sentinel-reconciler-${VERSION}.tgz" | grep -E "^version: ${VERSION}$"
            helm show chart "dist/redis-sentinel-reconciler-${VERSION}.tgz" | grep -E "^appVersion: \"?${VERSION}\"?$"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.ref_type == 'tag'
        with:
          context: .
          push: true
          tags: |
            vpnmesh/redis-sentinel-reconciler:${{ steps.ver.outputs.version }}
            vpnmesh/redis-sentinel-reconciler:latest
      - name: Helm OCI push
        if: github.ref_type == 'tag'
        run: helm push dist/redis-sentinel-reconciler-*.tgz oci://ghcr.io/vpnmesh/charts
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/sha256sums.txt
          generate_release_notes: true
