name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/package-linux-amd64.sh
      - name: Tarball CLI lockstep
        run: |
          tar -tzf dist/redis-sentinel-reconciler_*_linux_amd64.tar.gz | head
          dir="$(tar -tzf dist/redis-sentinel-reconciler_*_linux_amd64.tar.gz | head -1 | cut -d/ -f1)"
          tar -xzf dist/redis-sentinel-reconciler_*_linux_amd64.tar.gz -C /tmp
          /tmp/"$dir"/reconciler -h 2>&1 | tee /tmp/rsr-rel-help.txt
          grep -E -- '-tls$' /tmp/rsr-rel-help.txt
          grep -- '-redis-username' /tmp/rsr-rel-help.txt
          grep -- '-sentinel-username' /tmp/rsr-rel-help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/sha256sums.txt
          generate_release_notes: true
