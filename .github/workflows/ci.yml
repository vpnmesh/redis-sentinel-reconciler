name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: CLI flags lockstep
        run: |
          go build -o /tmp/reconciler ./cmd/reconciler
          /tmp/reconciler -h 2>&1 | tee /tmp/rsr-help.txt
          grep -E -- '-tls$' /tmp/rsr-help.txt
          grep -- '-redis-username' /tmp/rsr-help.txt
          grep -- '-sentinel-username' /tmp/rsr-help.txt
          grep -- '-config' /tmp/rsr-help.txt
